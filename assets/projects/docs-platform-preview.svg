  <text x="30" y="140" fill="#94a3b8" font-family="monospace" font-size="13">• Modern, dark-themed responsive documentation portals deployed via GitHub Pages</text><text x="30" y="166" fill="#94a3b8" font-family="monospace" font-size="13">• Crafted with clean semantic HTML5, modern CSS3 styling, and client-side JavaScript</text><text x="30" y="192" fill="#94a3b8" font-family="monospace" font-size="13">• Implements strict visual hierarchy, typography system, and accessibility guidelines</text><text x="30" y="218" fill="#94a3b8" font-family="monospace" font-size="13">• Supports real-time bot management, platform policies, and user onboarding flows</text><text x="30" y="244" fill="#94a3b8" font-family="monospace" font-size="13">• Demonstrates complete full-stack presentation from design to production deployment</text>
  
